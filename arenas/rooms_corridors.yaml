world:
  height: 20
  width: 20
  step_time: 0.1  # 10Hz simulation for accurate physics
  sample_time: 0.1  # 10Hz rendering to match fps=10
  offset: [0, 0]
  collision_mode: 'stop'
  control_mode: 'auto'

gui:
  keyboard:
    backend: 'mpl'

robot:
  - number: 1  # Will be overridden by run_simulation.py
    kinematics: {name: 'omni', noise: False}
    shape: 
      name: 'polygon'
      vertices: 
        - [0, -0.05]
        - [0, 0.05]
        - [0.1, 0]
    distribution: {name: 'manual'}  # Manual distribution with states generated in run_simulation.py
    state: [5, 5, 0]  # Will be overridden by run_simulation.py with generated positions
    velocity: [0.5, 0.5]

    behavior: { 
      name: 'levy',
      max_vel: 0.5,
      max_yaw: 0.5,
      alpha_min: 2.0,
      alpha_max: 3.0,
      min_flight_distance: 0.5,
      max_flight_distance: 20.0,
      collision_threshold: 0.4,
      back_sensor_weight: 0.3,
      kappa_min: 0.6,
      kappa_max: 10.0,
      mode: 'reactive_levy'
    }

    sensors:
      - name: 'lidar2d'  # front
        range_min: 0
        range_max: 4
        offset: [0, 0, 0]
        angle_range: 0
        number: 1
        noise: False

      - name: 'lidar2d'  # left
        range_min: 0
        range_max: 4
        offset: [0, 0, 1.57]
        angle_range: 0
        number: 1
        noise: False

      - name: 'lidar2d'  # right
        range_min: 0
        range_max: 4
        offset: [0, 0, -1.57]
        angle_range: 0
        number: 1
        noise: False

      - name: 'lidar2d'  # back
        range_min: 0
        range_max: 4
        offset: [0, 0, 3.14]
        angle_range: 0
        number: 1
        noise: False

obstacle:
  # Borders around entire map
  # Top border
  - shape: {name: 'rectangle', length: 20, width: 0.1}
    state: [10, 19.95, 0]
  
  # Bottom border
  - shape: {name: 'rectangle', length: 20, width: 0.1}
    state: [10, 0.05, 0]
  
  # Left border
  - shape: {name: 'rectangle', length: 0.1, width: 20}
    state: [0.05, 10, 0]
  
  # Right border
  - shape: {name: 'rectangle', length: 0.1, width: 20}
    state: [19.95, 10, 0]
  
  # Horizontal corridor (2m wide, y=9 to y=11, centered at y=10)
  # Top-left room bottom wall - left segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [1.75, 11, 0]
  
  # Top-left room bottom wall - right segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [6.25, 11, 0]
  
  # Top-right room bottom wall - left segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [9.75, 11, 0]
  
  # Top-right room bottom wall - right segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [14.25, 11, 0]
  
  # Bottom-left room top wall - left segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [1.75, 9, 0]
  
  # Bottom-left room top wall - right segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [6.25, 9, 0]
  
  # Bottom-right room top wall - left segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [9.75, 9, 0]
  
  # Bottom-right room top wall - right segment (1m door opening at center)
  - shape: {name: 'rectangle', length: 3.5, width: 0.1}
    state: [14.25, 9, 0]
  
  # Vertical corridor (2m wide, x=16 to x=18, centered at x=17)
  # Left vertical wall - bottom segment (below intersection)
  # Bottom part (below door)
  - shape: {name: 'rectangle', length: 0.1, width: 4}
    state: [16, 2, 0]
  
  # Top part (above door, below corridor intersection)
  - shape: {name: 'rectangle', length: 0.1, width: 4}
    state: [16, 7, 0]
  
  # Left vertical wall - top segment (above intersection)
  # Bottom part (above corridor intersection, below door)
  - shape: {name: 'rectangle', length: 0.1, width: 4}
    state: [16, 13, 0]
  
  # Top part (above door)
  - shape: {name: 'rectangle', length: 0.1, width: 4}
    state: [16, 18, 0]
  
  # Vertical wall dividing bottom room into two rooms
  - shape: {name: 'rectangle', length: 0.1, width: 9}
    state: [8, 4.5, 0]